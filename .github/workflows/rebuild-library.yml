name: Rebuild My Library indexes

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.webp"
      - "**/meta.json"
      - "library.config.json"
      - "assets/category-index.html"
      - "scripts/**"
      - ".github/workflows/rebuild-library.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build library indexes
        run: python scripts/build_library.py

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add library-all.json
          git add -- '*/library.json'
          git add -- '*/index.html'

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore: rebuild My Library indexes [skip ci]"
          git push
