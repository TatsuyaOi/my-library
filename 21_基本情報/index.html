<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>My Library</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--text:#17191c;--muted:#6e737b;
  --line:#e4e7eb;--accent:#2867d8;--accent-soft:#edf3ff;
  --shadow:0 8px 24px rgba(0,0,0,.055);--radius:20px
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  font-size:18px;line-height:1.65
}
a{color:inherit}
button,input{font:inherit}
.wrap{
  width:min(100%,780px);margin:auto;
  padding:max(18px,env(safe-area-inset-top)) 16px max(42px,env(safe-area-inset-bottom))
}
.back{
  display:inline-flex;align-items:center;min-height:44px;padding:0 6px;
  color:var(--accent);font-weight:800;text-decoration:none
}
.hero{padding:14px 4px 18px}
.hero-row{display:flex;align-items:center;gap:15px}
.hero-icon{
  display:grid;place-items:center;width:64px;height:64px;flex:none;
  border-radius:20px;background:var(--accent-soft);font-size:2rem
}
h1{margin:0;font-size:clamp(2.2rem,10vw,3.8rem);line-height:1.05;letter-spacing:-.035em}
.lead{margin:12px 0 0;color:var(--muted);font-size:.98rem}
.search-wrap{
  position:sticky;top:0;z-index:10;padding:8px 0 12px;
  background:linear-gradient(to bottom,rgba(246,247,249,.97) 75%,rgba(246,247,249,0));
  backdrop-filter:blur(10px)
}
.search{
  display:flex;align-items:center;gap:10px;min-height:58px;padding:0 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)
}
.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}
.filters{display:flex;gap:8px;overflow:auto;padding:2px 1px 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{
  white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);
  border-radius:999px;padding:9px 13px;font-size:.82rem;font-weight:800;cursor:pointer
}
.filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
.section-title{
  display:flex;justify-content:space-between;align-items:center;
  margin:20px 4px 10px;font-size:.92rem;color:var(--muted);font-weight:900;letter-spacing:.03em
}
.count{font-size:.76rem;font-weight:700}
.list{display:grid;gap:11px}
.card{
  display:block;padding:17px 18px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);text-decoration:none;-webkit-tap-highlight-color:transparent
}
.card.has-thumb{display:grid;grid-template-columns:92px minmax(0,1fr);gap:13px;align-items:start}
.card-thumb{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--line);border-radius:14px;background:var(--accent-soft)}
.card:active{transform:scale(.987)}
.card-top{display:flex;align-items:flex-start;gap:10px}
.card-main{min-width:0;flex:1}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{
  display:inline-block;padding:3px 8px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-size:.68rem;font-weight:900
}
.card h2{margin:0;font-size:1.08rem;line-height:1.35}
.arrow{color:#aaa;font-size:1.35rem;line-height:1.25}
.desc{margin:6px 0 0;color:var(--muted);font-size:.84rem;line-height:1.5}
.tags{margin-top:8px;color:#8b9097;font-size:.72rem}
.meta{margin-top:7px;color:#9a9ea4;font-size:.72rem}
.empty{
  padding:26px 18px;background:#fff;border:1px dashed #cbd0d5;
  border-radius:18px;text-align:center;color:var(--muted)
}
.error{
  padding:18px;background:#fff1f1;border:1px solid #f0caca;
  border-radius:18px;color:#7c3434
}
footer{padding:28px 4px 6px;text-align:center;color:#999;font-size:.75rem}
@media(min-width:680px){.wrap{padding-left:26px;padding-right:26px}.list{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.card.has-thumb{grid-template-columns:78px minmax(0,1fr);gap:11px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../index.html">← My Library</a>

  <header class="hero">
    <div class="hero-row">
      <div class="hero-icon" id="categoryIcon">📚</div>
      <h1 id="categoryTitle">読み込み中…</h1>
    </div>
    <p class="lead" id="categoryDescription"></p>
  </header>

  <div class="search-wrap">
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" aria-label="資料を検索" placeholder="資料を検索…" autocomplete="off">
    </label>
  </div>

  <div class="filters" id="filters"></div>

  <div class="section-title">
    <span id="sectionLabel">すべての資料</span>
    <span class="count" id="count"></span>
  </div>

  <section class="list" id="list">
    <div class="empty">資料一覧を読み込んでいます…</div>
  </section>

  <footer id="footer">My Library</footer>
</main>

<script>
const els = {
  title: document.getElementById("categoryTitle"),
  icon: document.getElementById("categoryIcon"),
  description: document.getElementById("categoryDescription"),
  filters: document.getElementById("filters"),
  input: document.getElementById("searchInput"),
  section: document.getElementById("sectionLabel"),
  count: document.getElementById("count"),
  list: document.getElementById("list"),
  footer: document.getElementById("footer")
};

let data = null;
let activeGroup = "すべて";

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  })[m]);
}

function fileUrl(value){
  const path = String(value ?? "");
  if (!path || /^[a-z][a-z0-9+.-]*:/i.test(path) || path.startsWith("/") || /[\\\x00-\x1f]/.test(path) || path.split("/").includes("..")) return "#";
  return path.split("/").map(encodeURIComponent).join("/");
}

function hexToSoft(hex) {
  const clean = String(hex || "").replace("#","");
  if (!/^[0-9a-fA-F]{6}$/.test(clean)) return "#edf3ff";
  const r = parseInt(clean.slice(0,2),16);
  const g = parseInt(clean.slice(2,4),16);
  const b = parseInt(clean.slice(4,6),16);
  return `rgba(${r},${g},${b},0.10)`;
}

function groups() {
  return ["すべて", ...new Set((data.items || []).map(x => x.group || "未分類"))];
}

function renderFilters() {
  els.filters.innerHTML = groups().map(g => `
    <button class="filter ${g === activeGroup ? "active" : ""}" data-group="${escapeHtml(g)}">
      ${escapeHtml(g)}
    </button>
  `).join("");

  els.filters.querySelectorAll(".filter").forEach(btn => {
    btn.addEventListener("click", () => {
      activeGroup = btn.dataset.group;
      renderFilters();
      renderItems();
    });
  });
}

function renderItems() {
  if (!data) return;
  const q = els.input.value.trim().toLowerCase();

  const items = (data.items || [])
    .filter(item => activeGroup === "すべて" || (item.group || "未分類") === activeGroup)
    .filter(item => {
      const haystack = [
        item.title, item.group, item.description, ...(item.tags || [])
      ].join(" ").toLowerCase();
      return haystack.includes(q);
    });

  els.section.textContent = activeGroup === "すべて" ? "すべての資料" : activeGroup;
  els.count.textContent = `${items.length} 件`;

  if (!items.length) {
    els.list.innerHTML = `<div class="empty">${
      (data.items || []).length === 0
        ? "まだ資料がありません。HTMLをこのフォルダへ追加してPushすると、自動でここに表示されます。"
        : "条件に合う資料がありません。"
    }</div>`;
    return;
  }

  els.list.innerHTML = items.map(item => `
    <a class="card ${item.thumbnail ? 'has-thumb' : ''}" href="${escapeHtml(fileUrl(item.file))}">
      ${item.thumbnail ? `<img class="card-thumb" src="${escapeHtml(fileUrl(item.thumbnail))}" alt="${escapeHtml(item.thumbnail_alt || item.title)}" width="640" height="800" loading="lazy" decoding="async">` : ''}
      <div class="card-top">
        <div class="card-main">
          <div class="badges">
            ${item.pinned ? '<span class="badge">★ よく見る</span>' : ''}
            ${item.group ? `<span class="badge">${escapeHtml(item.group)}</span>` : ''}
          </div>
          <h2>${escapeHtml(item.title)}</h2>
          ${item.description ? `<p class="desc">${escapeHtml(item.description)}</p>` : ''}
          ${(item.tags || []).length ? `<div class="tags">${item.tags.map(escapeHtml).join(" · ")}</div>` : ''}
          ${item.updated ? `<div class="meta">更新：${escapeHtml(item.updated)}</div>` : ''}
        </div>
        <span class="arrow">›</span>
      </div>
    </a>
  `).join("");
}

async function init() {
  try {
    const response = await fetch("./library.json", {cache:"no-store"});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    data = await response.json();

    const c = data.category || {};
    document.title = `${c.title || "Library"} | My Library`;
    els.title.textContent = c.title || "Library";
    els.icon.textContent = c.icon || "📚";
    els.description.textContent = c.description || "";
    els.footer.textContent = `${c.title || "Library"} · My Library`;

    if (c.accent) {
      document.documentElement.style.setProperty("--accent", c.accent);
      document.documentElement.style.setProperty("--accent-soft", hexToSoft(c.accent));
      document.querySelector('meta[name="theme-color"]').setAttribute("content", c.accent);
    }

    renderFilters();
    renderItems();
  } catch (err) {
    els.title.textContent = "読み込みエラー";
    els.list.innerHTML = `
      <div class="error">
        library.json を読み込めませんでした。<br>
        GitHub Actions の実行が完了しているか確認してください。
      </div>`;
    console.error(err);
  }
}

els.input.addEventListener("input", renderItems);
init();
</script>
</body>
</html>
