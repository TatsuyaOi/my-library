name: Validate Prompt Suite

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify manifest without repairing it
        run: python scripts/build_suite_manifest.py --check
      - name: Validate suite structure
        run: python scripts/validate_suite.py --report-dir reports/ci
      - name: Run validator and library regression tests
        run: python -m unittest discover -s tests -v
      - name: Save structural validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suite-validation
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 14
