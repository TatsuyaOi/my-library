<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>My Library</title>
<style>
:root{--bg:#f7f7f5;--surface:#fff;--text:#171717;--muted:#6b6b6b;--line:#e7e7e2;--accent:#1f5eff;--soft:#edf2ff;--radius:22px;--shadow:0 10px 30px rgba(0,0,0,.055)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:18px;line-height:1.65}
a{color:inherit}
.wrap{width:min(100%,820px);margin:auto;padding:max(24px,env(safe-area-inset-top)) 18px max(42px,env(safe-area-inset-bottom))}
.hero{padding:18px 4px 12px}
.eyebrow{margin:0 0 4px;color:var(--accent);font-size:.78rem;font-weight:900;letter-spacing:.08em}
h1{margin:0;font-size:clamp(2.4rem,10vw,4.2rem);line-height:1.05;letter-spacing:-.04em}
.lead{margin:14px 0 0;color:var(--muted);font-size:.96rem}
.search-area{position:sticky;top:0;z-index:10;padding:12px 0 16px;background:linear-gradient(to bottom,rgba(247,247,245,.98) 72%,rgba(247,247,245,0));backdrop-filter:blur(10px)}
.search{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.search input{width:100%;border:0;outline:0;background:transparent;font:inherit;color:var(--text)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 11px;color:var(--muted)}
.section-head strong{font-size:.9rem;letter-spacing:.04em}
.small{font-size:.74rem}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.category{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:14px;min-height:108px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none}
.icon{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--soft);font-size:1.65rem}
.category h2{margin:0;font-size:1.15rem;line-height:1.25}
.category p{margin:5px 0 0;color:var(--muted);font-size:.82rem;line-height:1.45}
.arrow{color:#aaa;font-size:1.4rem;font-weight:700}
.result-list{display:grid;gap:10px}
.result{display:block;padding:16px 17px;background:#fff;border:1px solid var(--line);border-radius:18px;text-decoration:none;box-shadow:var(--shadow)}
.result.has-thumb{display:grid;grid-template-columns:88px minmax(0,1fr);gap:13px;align-items:start}
.result-thumb{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--line);border-radius:13px;background:var(--soft)}
.result-main{min-width:0}
.result-top{display:flex;justify-content:space-between;gap:12px}
.result h3{margin:0;font-size:1rem}
.result p{margin:5px 0 0;color:var(--muted);font-size:.8rem}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.badge{display:inline-block;padding:3px 8px;background:var(--soft);color:var(--accent);border-radius:999px;font-size:.66rem;font-weight:900}
.meta{margin-top:7px;color:#999;font-size:.7rem}
.empty{padding:20px;background:#fff;border:1px dashed #ccc;border-radius:18px;color:var(--muted);text-align:center}
.hidden{display:none!important}
footer{margin-top:30px;text-align:center;color:#999;font-size:.76rem}
@media(min-width:650px){.wrap{padding-left:28px;padding-right:28px}.grid{grid-template-columns:1fr 1fr}.category{grid-template-columns:54px 1fr}.category>.arrow{display:none}}
@media(max-width:380px){.result.has-thumb{grid-template-columns:76px minmax(0,1fr);gap:11px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero">
<p class="eyebrow">PERSONAL HTML LIBRARY</p>
<h1>My Library</h1>
<p class="lead">HTMLをフォルダへ追加してPushするだけ。カテゴリ一覧・検索・最近追加は自動更新されます。</p>
</header>

<div class="search-area">
<label class="search"><span>⌕</span><input id="search" type="search" placeholder="全資料を検索…" autocomplete="off"></label>
</div>

<section id="categoriesSection">
  <div class="section-head"><strong>LIBRARY</strong><span class="small" id="totalCount"></span></div>
  <div class="grid" id="categories"></div>
</section>

<section id="resultsSection" class="hidden">
  <div class="section-head"><strong>検索結果</strong><span class="small" id="resultCount"></span></div>
  <div class="result-list" id="results"></div>
</section>

<section id="recentSection">
  <div class="section-head"><strong>最近更新した資料</strong><span class="small">最新12件</span></div>
  <div class="result-list" id="recent"></div>
</section>

<footer>My Library · GitHub Pages</footer>
</main>

<script>
let library = {categories:[], items:[]};
const $ = id => document.getElementById(id);

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}

function itemHtml(item){
  return `
    <a class="result ${item.thumbnail_url ? 'has-thumb' : ''}" href="${encodeURI(item.url)}">
      ${item.thumbnail_url ? `<img class="result-thumb" src="${encodeURI(item.thumbnail_url)}" alt="${esc(item.thumbnail_alt || item.title)}" width="640" height="800" loading="lazy" decoding="async">` : ''}
      <div class="result-main">
        <div class="badges">
          <span class="badge">${esc(item.category_title || "")}</span>
          ${item.group ? `<span class="badge">${esc(item.group)}</span>` : ""}
          ${item.pinned ? `<span class="badge">★ よく見る</span>` : ""}
        </div>
        <div class="result-top"><h3>${esc(item.title)}</h3><span class="arrow">›</span></div>
        ${item.description ? `<p>${esc(item.description)}</p>` : ""}
        ${item.updated ? `<div class="meta">更新：${esc(item.updated)}</div>` : ""}
      </div>
    </a>`;
}

function renderCategories(){
  $("categories").innerHTML = library.categories.map(c => `
    <a class="category" href="${encodeURI("./"+c.folder+"/")}">
      <div class="icon">${esc(c.icon || "📚")}</div>
      <div>
        <h2>${esc(c.title)}</h2>
        <p>${esc(c.description || "")}<br>${c.count}件</p>
      </div>
      <span class="arrow">›</span>
    </a>`).join("");
  $("totalCount").textContent = `全 ${library.items.length} 件`;
}

function renderRecent(){
  const items = [...library.items].slice(0,12);
  $("recent").innerHTML = items.length ? items.map(itemHtml).join("") :
    `<div class="empty">まだ資料がありません。</div>`;
}

function search(){
  const q = $("search").value.trim().toLowerCase();
  if(!q){
    $("categoriesSection").classList.remove("hidden");
    $("recentSection").classList.remove("hidden");
    $("resultsSection").classList.add("hidden");
    return;
  }
  const hits = library.items.filter(item => [
    item.title,item.description,item.group,item.category_title,...(item.tags||[])
  ].join(" ").toLowerCase().includes(q));

  $("categoriesSection").classList.add("hidden");
  $("recentSection").classList.add("hidden");
  $("resultsSection").classList.remove("hidden");
  $("resultCount").textContent = `${hits.length} 件`;
  $("results").innerHTML = hits.length ? hits.map(itemHtml).join("") :
    `<div class="empty">該当する資料がありません。</div>`;
}

async function init(){
  try{
    const r = await fetch("./library-all.json",{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    library = await r.json();
    renderCategories();
    renderRecent();
  }catch(e){
    $("categories").innerHTML = `<div class="empty">library-all.json を読み込めません。GitHub Actionsの完了を確認してください。</div>`;
    console.error(e);
  }
}
$("search").addEventListener("input",search);
init();
</script>
</body>
</html>
